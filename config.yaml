city:
  name: "Valencia"
  center: [39.4699, -0.3763]   # [lat, lon] del centro del mapa
  zoom: 12
  bbox: "39.38,-0.45,39.55,-0.29"  # (S,W,N,E) para queries Overpass

  # Capa de áreas de análisis (secciones censales u otra división territorial)
  areas:
    url: "https://geoportal.valencia.es/server/rest/services/OPENDATA/UrbanismoEInfraestructuras/MapServer/210/query?where=1=1&outFields=*&f=geojson"
    id_field: "coddistsecc"   # campo que identifica cada área en el tooltip

analysis:
  # Modo de cálculo de accesibilidad:
  #   "distance" → radio euclidiano simple (por defecto, sin GTFS)
  #   "transit"  → isócrona por transporte público (requiere gtfs_sources)
  mode: transit
  distance_m: 800         # radio en metros (modo distance)
  time_minutes: 15         # presupuesto total de viaje en minutos (modo transit)
  walking_speed_mpm: 80    # metros por minuto a pie (~4.8 km/h)
  max_walk_to_stop_m: 400  # máx. distancia a pie hasta/desde una parada
  # Fuentes GTFS (se pueden combinar varias redes).
  # Datos estáticos: suficientes para análisis de accesibilidad típica.
  # GTFS-RT (tiempo real) no aplica — solo añade posiciones/retrasos instantáneos.
  # Valenbisi usa GBFS (bicicletas), formato distinto; no entra en este grafo.
  gtfs_sources:
    - id: metro
      label: "Metrovalencia (FGV)"
      # Feed oficial de FGV — fuente más cercana a la Generalitat Valenciana
      # Referencia NAP: https://nap.transportes.gob.es/Files/Detail/967
      url: "http://www.metrovalencia.es/google_transit_feed/google_transit.zip"
      # El servidor redirige a HTTPS con certificado FNMT (no incluido en Python por defecto)
      verify_ssl: false
    - id: emt
      label: "EMT Valencia (autobuses urbanos)"
      # Portal Datos Abiertos Ajuntament de València (CC BY 4.0)
      # Catálogo: https://datos.gob.es/es/catalogo/l01462508-google-transit-lineas-paradas-horarios-de-autobuses-de-la-emt-de-valencia
      # Referencia NAP: https://nap.transportes.gob.es/Files/Detail/965
      # Nota: el nombre del fichero lleva la fecha de publicación y cambia en cada actualización
      url: "https://opendata.vlci.valencia.es/dataset/ab058cf8-ad3e-4d9c-ac89-0c6367ecf351/resource/c81b69e6-c082-44dc-acc6-66fc417b4e66/download/google_transit2026-05-31.zip"

map:
  emoji_min_zoom: 14  # zoom mínimo a partir del cual aparecen los emojis

# Lista de servicios a analizar.
# Tipos disponibles:
#   url     → descarga directa de un GeoJSON desde una URL
#   overpass → consulta a la API de OpenStreetMap (Overpass); usa {bbox} como placeholder
#
# Campos opcionales:
#   filter.field    → nombre del campo sobre el que filtrar
#   filter.contains → subcadena que debe contener el campo (búsqueda sin distinción de mayúsculas)

services:
  - id: salud
    label: "Centros de Salud"
    emoji: "🏥"
    url: "https://terramapas.icv.gva.es/15_SistemaValencianoSalud?request=GetFeature&service=WFS&version=2.0.0&typename=CentrosSanitarios.CentrosSalud&outputformat=geojson"
    name_field: "cen_desclar"

  - id: primaria
    label: "Ed. Primaria"
    emoji: "🏫"
    url: "https://opendata.vlci.valencia.es/dataset/11436f0c-082b-4e5b-9659-005f5b528bde/resource/938e34b7-bb7d-4b0c-8176-3602d47ebd6a/download/centros-educativos-en-valencia.geojson"
    name_field: "dlibre"
    filter:
      field: "dgenerica"
      contains: "PRIMÀR"

  - id: secundaria
    label: "Ed. Secundaria"
    emoji: "📚"
    url: "https://opendata.vlci.valencia.es/dataset/11436f0c-082b-4e5b-9659-005f5b528bde/resource/938e34b7-bb7d-4b0c-8176-3602d47ebd6a/download/centros-educativos-en-valencia.geojson"
    name_field: "dlibre"
    filter:
      field: "dgenerica"
      contains: "SECUNDÀR"

  - id: transporte
    label: "Transporte Público"
    emoji: "🚌"
    url: "https://geoportal.valencia.es/server/rest/services/OPENDATA/Trafico/MapServer/221/query?where=1=1&outFields=*&f=geojson"
    name_field: "nombre"

  - id: supermercados
    label: "Supermercados"
    emoji: "🛒"
    type: overpass
    overpass_query: '(nwr["shop"="supermarket"]({bbox});); out center;'
    name_field: "name"

  - id: zonas_verdes
    label: "Zonas Verdes"
    emoji: "🌳"
    url: "https://geoportal.valencia.es/server/rest/services/OPENDATA/MedioAmbiente/MapServer/8/query?where=1=1&outFields=*&f=geojson"
    name_field: "nombre"

  - id: cultura
    label: "Cultura"
    emoji: "🎭"
    type: overpass
    # Incluye: bibliotecas, teatros, cines y centros culturales/artes
    overpass_query: '(nwr["amenity"="library"]({bbox});nwr["amenity"="theatre"]({bbox});nwr["amenity"="cinema"]({bbox});nwr["amenity"="arts_centre"]({bbox});); out center;'
    name_field: "name"

  - id: farmacias
    label: "Farmacias"
    emoji: "💊"
    type: overpass
    # OpenStreetMap — cobertura excelente en España (ODbL)
    overpass_query: '(nwr["amenity"="pharmacy"]({bbox});); out center;'
    name_field: "name"
